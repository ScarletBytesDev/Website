<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ScarletBytes</title>

    <!-- Site icon -->
    <link href="/assets/favicon.svg" rel="icon" type="image/svg+xml" />

    <!-- Search engines and browser appearance -->
    <meta content="ScarletBytes — streaming, projects and more." name="description" />
    <meta content="Anna Sas" name="author" />
    <meta content="index, follow" name="robots" />
    <meta content="#101a22" name="theme-color" />
    <meta content="dark" name="color-scheme" />

    <!-- Preferred public URL -->
    <link href="https://scarletbytes.dev/" rel="canonical" />

    <!-- Open Graph / Facebook, LinkedIn, Discord, etc. -->
    <meta content="ScarletBytes" property="og:site_name" />
    <meta content="website" property="og:type" />
    <meta content="https://scarletbytes.dev/" property="og:url" />
    <meta content="ScarletBytes | Build. Stream. Repeat." property="og:title" />
    <meta
        content="Streaming, projects and more from ScarletBytes."
        property="og:description"
    />
    <meta content="https://scarletbytes.dev/assets/socialPreview.png" property="og:image" />
    <meta content="1200" property="og:image:width" />
    <meta content="630" property="og:image:height" />
    <meta content="ScarletBytes social preview" property="og:image:alt" />
    <meta content="en_BE" property="og:locale" />

    <!-- Twitter / X -->
    <meta content="summary_large_image" name="twitter:card" />
    <meta content="ScarletBytes | Build. Stream. Repeat." name="twitter:title" />
    <meta
        content="Streaming, projects and more from ScarletBytes."
        name="twitter:description"
    />
    <meta content="https://scarletbytes.dev/assets/socialPreview.png" name="twitter:image" />
    <meta content="ScarletBytes social preview" name="twitter:image:alt" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
